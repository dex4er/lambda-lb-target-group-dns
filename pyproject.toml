[tool.poetry]
authors = ["Piotr Roszatycki <piotr.roszatycki@gmail.com>"]
description = "AWS Lambda which registers IP addresses to the LB Target Group based on DNS record."
license = "MIT"
name = "lambda_lb_target_group_dns"
repository = "https://github.com/dex4er/lambda-lb-target-group-dns"
version = "0.2.0"

[tool.poetry.dependencies]
python = "^3.12"
dnspython = "^2.7.0"

[tool.poetry.group.dev.dependencies]
aws-lambda-powertools = "^2.43.1"
boto3 = "^1.35.24"
boto3-stubs = { extras = ["full"], version = "^1.35.24" }
typed-argparse = "^0.3.1"

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core"]

[tool.poetry-plugin-lambda-build]
without = "dev"
