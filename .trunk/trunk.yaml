version: 0.1
cli:
  version: 1.22.6
plugins:
  sources:
    - id: trunk
      ref: v1.6.3
      uri: https://github.com/trunk-io/plugins
lint:
  disabled:
    - checkov
    - gokart
    - terrascan
    - trivy
    - trufflehog
  enabled:
    - bandit@1.7.10
    - black@24.8.0
    - isort@5.13.2
    - osv-scanner@1.9.0
    - ruff@0.6.8
    - actionlint@1.7.3
    - dotenv-linter@3.3.0
    - git-diff-check
    - gitleaks@8.20.0
    - markdownlint@0.42.0
    - prettier@3.3.3
    - renovate@38.109.0
    - taplo@0.9.3
    - terraform@1.6.6
    - tflint@0.53.0
    - yamllint@1.35.1
runtimes:
  enabled:
    - go@1.21.4
    - node@20.18.0
    - python@3.11.6
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
